<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在前往 Erable-Mod 官网 ...</title>
<link rel="icon" type="image/x-icon" href="icon.ico">

<!-- 没有 JS 时的兜底跳转 -->
<meta http-equiv="refresh" content="1;url=http://150.138.84.90:13802/">

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    color: #e2e2f0;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    text-align: center;
    padding: 24px;
  }

  .box { max-width: 420px; width: 100%; }

  .ring {
    width: 44px;
    height: 44px;
    margin: 0 auto 24px;
    border: 3px solid rgba(108,92,231,0.25);
    border-top-color: #6c5ce7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }

  p {
    font-size: 14px;
    line-height: 1.8;
    color: #8888aa;
    margin-bottom: 24px;
  }

  a {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    background: linear-gradient(135deg, #6c5ce7, #8b5cf6);
    box-shadow: 0 4px 20px rgba(108,92,231,0.35);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(108,92,231,0.5);
  }

  .url {
    margin-top: 20px;
    font-size: 12px;
    color: #5a5a7a;
    word-break: break-all;
  }
</style>
</head>
<body>

<div class="box">

  <div class="url">http://150.138.84.90:13802/</div>
</div>

<script>
  (function () {
    var target = 'http://150.138.84.90:13802/';
    // 用 replace 而不是 href：跳过去之后按「后退」不会又弹回这个中转页
    try { window.location.replace(target); } catch (e) { }
  })();
</script>

</body>
</html>
